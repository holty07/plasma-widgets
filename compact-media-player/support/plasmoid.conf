# cava config for the Compact Media Player plasmoid.
# Raw ASCII frames on stdout; cava-plasmoid-bridge relays them to the widget.

[general]
# Higher than any sensible bar count in the widget — it resamples down, so you
# never have to touch this when you resize the widget.
bars = 64
framerate = 60
autosens = 1
sensitivity = 100
lower_cutoff_freq = 50
higher_cutoff_freq = 12000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
monstercat = 0
waves = 0
